name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is what the README claims support for, so it must be proven.
        # Linux is here to catch path and line-ending assumptions early.
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  smoke:
    name: it starts and exits cleanly
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Show the command-line help
        run: python -m bridge --help

      # No token and no chat files here, so this proves the whole pipeline
      # boots, finds nothing, and exits without error.
      - name: Dry run against an empty machine
        run: python -m bridge --dry-run --once
